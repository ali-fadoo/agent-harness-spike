name: pipeline-check
on: workflow_dispatch

jobs:
  spike:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Open a PR to prove the trigger fired
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="harness/trigger-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "Harness trigger ran successfully at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > harness-trigger.txt
          git add harness-trigger.txt
          git commit -m "Harness trigger ran successfully"
          git push origin "$BRANCH"
          gh pr create \
            --title "Harness trigger ran successfully" \
            --body "Opened automatically by the harness trigger check. No model call involved." \
            --base main \
            --head "$BRANCH"
