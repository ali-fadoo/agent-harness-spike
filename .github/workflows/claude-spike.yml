name: Claude PR spike

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to ask Claude to do"
        required: true
        default: "Create a file named spike-test.txt containing the text abc. Then open a pull request with that change."

jobs:
  claude-spike:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5"
          show_full_output: true
          prompt: |
            Create a file named spike-test.txt containing the text abc.
            Then open a pull request with that change.
